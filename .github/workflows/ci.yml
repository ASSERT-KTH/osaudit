name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv venv && uv pip install -e '.[dev]'
      - run: .venv/bin/ruff check .
      - run: .venv/bin/mypy osaudit tests
      - run: .venv/bin/pytest -q --cov=osaudit --cov-report=term-missing
