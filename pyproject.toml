[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osaudit"
version = "0.1.0"
description = "Automated open-science audit: trace every claim of a paper to its evidence"
readme = "README.md"
license = "MIT"
authors = [{ name = "Martin Monperrus" }]
requires-python = ">=3.13"
dependencies = []
keywords = ["open science", "reproducibility", "audit", "latex", "provenance", "citations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

[project.urls]
Homepage = "https://github.com/ASSERT-KTH/osaudit"
Issues = "https://github.com/ASSERT-KTH/osaudit/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "mypy", "ruff"]

[project.scripts]
osaudit = "osaudit._cli:main"

[tool.hatch.build.targets.wheel]
packages = ["osaudit"]

# An explicit list: the working tree holds local files (agent session transcripts in memory/)
# that hatch would otherwise ship, since it does not read .git/info/exclude.
[tool.hatch.build.targets.sdist]
include = ["osaudit/", "tests/", "README.md", "CONVENTIONS.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
